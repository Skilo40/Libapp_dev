<div class="app-layout" [class.sidebar-closed]="!sidebarOpen" [class.mobile-open]="mobileMenuOpen">
  <div class="sidebar-overlay" (click)="closeMobile()" [class.visible]="mobileMenuOpen"></div>
  <app-sidebar [isOpen]="sidebarOpen" [mobileOpen]="mobileMenuOpen" />
  <div class="main-area">
    <app-header (toggleSidebar)="toggleSidebar()" (toggleMobile)="toggleMobile()" />
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
