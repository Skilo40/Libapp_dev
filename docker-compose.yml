services:
  mongo:
    image: mongo:7
    container_name: library_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: library
    volumes:
      - mongo_data:/data/db
    networks:
      - library_net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: library_api
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:secret123@mongo:27017/library?authSource=admin
      JWT_SECRET: your_super_secret_key_change_this
      JWT_EXPIRES_IN: 7d
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your@gmail.com
      SMTP_PASS: your_app_password
      MAIL_FROM: Library App <your@gmail.com>
      NOTIFY_DAYS_BEFORE: 3
    networks:
      - library_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: library_client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - library_net

  mongo-express:
    image: mongo-express:latest
    container_name: library_mongo_express
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret123
      ME_CONFIG_MONGODB_URL: mongodb://admin:secret123@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    networks:
      - library_net

volumes:
  mongo_data:

networks:
  library_net:
    driver: bridge